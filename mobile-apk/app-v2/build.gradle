plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'omega.atlas.mobile.v2.app'
    compileSdk 36

    defaultConfig {
        applicationId 'omega.atlas.mobile.v2.dev'
        minSdk 26
        targetSdk 36
        versionCode 22
        versionName '0.2.0-alpha2-dev2'
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation project(':core:model')
    implementation project(':core:result')
    implementation project(':core:security')
    implementation project(':core:ui')
    implementation project(':feature:terminal')
    implementation project(':feature:sessions')
    implementation project(':feature:connections')
    implementation project(':feature:files')
    implementation project(':feature:editor')
    implementation project(':feature:git')
    implementation project(':feature:atlas')
    implementation project(':transport:ssh')
    implementation project(':transport:sftp')
    implementation project(':transport:gateway')
    implementation project(':storage:local')

    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'org.connectbot:termlib:0.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
