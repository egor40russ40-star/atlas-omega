plugins {
    id 'com.android.application'
}

android {
    namespace 'omega.atlas.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'omega.atlas.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-rc0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
