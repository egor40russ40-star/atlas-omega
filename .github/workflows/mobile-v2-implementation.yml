name: ATLAS Mobile 2 V2 Implementation Gate

on:
  push:
    branches: [atlas-mobile-v2-implementation]
    paths:
      - 'mobile-apk/**'
      - '.github/workflows/mobile-v2-implementation.yml'
  workflow_dispatch:

concurrency:
  group: mobile-v2-implementation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  safety:
    name: safety
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Static safety invariants
        working-directory: mobile-apk
        run: |
          set -euo pipefail
          grep -R "liveTradingEnabled: Boolean = false" core/model/src/main/kotlin
          grep -R "liveTradingAuthorityPresent: Boolean = false" core/model/src/main/kotlin
          grep -R "researchOnly: Boolean = true" core/model/src/main/kotlin
          grep -R "autoTrustNewDevice: Boolean = false" core/model/src/main/kotlin
          ! grep -R -E "PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY" core feature transport storage testing app-v2
          echo "SAFETY=PASS"

  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-36' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Compile V2 modules
        working-directory: mobile-apk
        run: |
          timeout 9m gradle --no-daemon --stacktrace --console=plain \
            :core:model:compileDebugKotlin \
            :core:result:compileDebugKotlin \
            :core:security:compileDebugKotlin \
            :core:ui:compileDebugKotlin \
            :feature:terminal:compileDebugKotlin \
            :feature:sessions:compileDebugKotlin \
            :feature:connections:compileDebugKotlin \
            :feature:files:compileDebugKotlin \
            :feature:editor:compileDebugKotlin \
            :feature:git:compileDebugKotlin \
            :feature:atlas:compileDebugKotlin \
            :transport:ssh:compileDebugKotlin \
            :transport:sftp:compileDebugKotlin \
            :transport:gateway:compileDebugKotlin \
            :storage:local:compileDebugKotlin \
            :testing:fakes:compileDebugKotlin \
            :app-v2:compileDebugKotlin

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-36' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Targeted V2 tests
        working-directory: mobile-apk
        run: |
          timeout 9m gradle --no-daemon --stacktrace --console=plain \
            :core:model:testDebugUnitTest \
            :core:result:testDebugUnitTest \
            :feature:terminal:testDebugUnitTest \
            :feature:sessions:testDebugUnitTest \
            :feature:files:testDebugUnitTest \
            :feature:editor:testDebugUnitTest \
            :feature:git:testDebugUnitTest \
            :feature:atlas:testDebugUnitTest \
            :transport:ssh:testDebugUnitTest \
            :transport:sftp:testDebugUnitTest \
            :storage:local:testDebugUnitTest

  legacy-regression:
    name: legacy-regression
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-36' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Alpha1 compile regression
        working-directory: mobile-apk
        run: timeout 6m gradle --no-daemon --stacktrace --console=plain :app:compileDebugKotlin

  gate-summary:
    name: gate-summary
    if: always()
    needs: [safety, compile, tests, legacy-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize implementation gate
        shell: bash
        run: |
          echo "safety=${{ needs.safety.result }}"
          echo "compile=${{ needs.compile.result }}"
          echo "tests=${{ needs.tests.result }}"
          echo "legacy-regression=${{ needs.legacy-regression.result }}"
          test "${{ needs.safety.result }}" = success
          test "${{ needs.compile.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.legacy-regression.result }}" = success
          echo "V2_FAST_GATE=PASS"
          echo "APK_BUILD=BLOCKED_UNTIL_G7"
          echo "LIVE_TRADING_ENABLED=NO"
          echo "RESEARCH_ONLY=YES"
