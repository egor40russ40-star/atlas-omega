name: ATLAS Mobile 2 V2 APK

on:
  push:
    branches: [atlas-mobile-v2-alpha1]
    paths:
      - 'mobile-apk/**'
      - '.github/workflows/mobile-v2-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-36' 'platform-tools'
          "$SDKM" --list_installed | grep -E 'platforms;android-36|platform-tools'

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static safety gates
        working-directory: mobile-apk
        run: |
          set -euo pipefail
          grep -R "LIVE_TRADING_ENABLED = false" app/src/main/kotlin
          grep -R "RESEARCH_ONLY = true" app/src/main/kotlin
          grep -R "Терминал" app/src/main/kotlin
          grep -R "https://tinvest-robot.tailf87948.ts.net" app/src/main/kotlin
          ! grep -R "http://127.0.0.1:8787" app/src/main/kotlin/omega/atlas/mobile/MainActivity.kt

      - name: Unit tests
        working-directory: mobile-apk
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android lint
        working-directory: mobile-apk
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Assemble installable debug APK
        working-directory: mobile-apk
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Package artifact and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile-apk/app/build/outputs/apk/debug/app-debug.apk dist/ATLAS_Mobile_2_v0.2.0-alpha1.apk
          sha256sum dist/ATLAS_Mobile_2_v0.2.0-alpha1.apk | tee dist/ATLAS_Mobile_2_v0.2.0-alpha1.apk.sha256
          stat -c 'APK_SIZE=%s' dist/ATLAS_Mobile_2_v0.2.0-alpha1.apk
          unzip -t dist/ATLAS_Mobile_2_v0.2.0-alpha1.apk >/dev/null
          echo 'APK_ZIP_INTEGRITY=PASS'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Mobile-2-v0.2.0-alpha1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
