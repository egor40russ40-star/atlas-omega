name: ATLAS Mobile APK RC0

on:
  push:
    branches:
      - atlas-mobile-apk-rc0
    paths:
      - 'mobile-apk/**'
      - '.github/workflows/atlas-mobile-apk-rc0.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p mobile-apk :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f mobile-apk/app/build/outputs/apk/debug/app-debug.apk
          sha256sum mobile-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Mobile-RC0-debug-apk
          path: mobile-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
